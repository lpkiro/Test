# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.x
    - name: Restore dependencies
      run: dotnet restore TestConsoleApp/TestConsoleApp.csproj
    - name: Restore test dependencies
      run: dotnet restore TestConsoleApp.Tests/TestConsoleApp.Tests.csproj
    - name: Build
      run: dotnet build TestConsoleApp/TestConsoleApp.csproj --no-restore
    - name: Build test
      run: dotnet build TestConsoleApp.Tests/TestConsoleApp.Tests.csproj --no-restore
    - name: Test
      run: dotnet test TestConsoleApp/TestConsoleApp.csproj --no-build --verbosity normal
    - name: Test test
      run: dotnet test TestConsoleApp.Tests/TestConsoleApp.Tests.csproj --no-build --verbosity normal
