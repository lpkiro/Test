name: Build PWPartyScanner clean

on:
  push:
    branches:
      - pw-party-scanner-clean
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Tesseract language data
        shell: cmd
        run: |
          if not exist PWPartyScanner\tessdata mkdir PWPartyScanner\tessdata
          curl.exe -L --fail --retry 3 -o PWPartyScanner\tessdata\eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata
          curl.exe -L --fail --retry 3 -o PWPartyScanner\tessdata\ukr.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ukr.traineddata
          curl.exe -L --fail --retry 3 -o PWPartyScanner\tessdata\rus.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata

      - name: Restore
        run: dotnet restore PWPartyScanner/PWPartyScanner.csproj

      - name: Publish self-contained x64
        run: dotnet publish PWPartyScanner/PWPartyScanner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PWPartyScanner-clean-win-x64
          path: publish/**
          if-no-files-found: error

# Region/OCR calibration updated for supplied PW screenshots.
